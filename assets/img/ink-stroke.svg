<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 40" role="img" aria-label="Brush stroke">
  <defs>
    <filter id="dry" x="-10%" y="-60%" width="120%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="inkFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#241F1A" stop-opacity="0.05"/>
      <stop offset="18%" stop-color="#241F1A" stop-opacity="0.7"/>
      <stop offset="62%" stop-color="#241F1A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#241F1A" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- one horizontal brush stroke: thick on the press, thin on the lift -->
  <path d="M6 22
           C 60 12, 130 16, 210 18
           C 288 20, 352 16, 414 24
           C 352 30, 286 28, 208 27
           C 128 26, 58 30, 6 22 Z"
        fill="url(#inkFade)" filter="url(#dry)"/>
</svg>
