<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Tileable end-grain (wood cross section). Growth rings centred on the
       four corners and the middle, so the tile repeats without a visible seam. -->
  <rect width="400" height="400" fill="#EADCC0"/>

  <g fill="none" stroke="#B99A6E" stroke-width="1.5" opacity="0.5">
    <!-- corner slice, repeated at all four corners -->
    <g>
      <ellipse cx="0" cy="0" rx="26" ry="22"/>
      <ellipse cx="0" cy="0" rx="48" ry="42"/>
      <ellipse cx="0" cy="0" rx="72" ry="63"/>
      <ellipse cx="0" cy="0" rx="98" ry="86"/>
      <ellipse cx="0" cy="0" rx="126" ry="111"/>
      <ellipse cx="0" cy="0" rx="156" ry="138"/>
      <ellipse cx="0" cy="0" rx="188" ry="166"/>
      <ellipse cx="0" cy="0" rx="222" ry="196"/>
      <ellipse cx="0" cy="0" rx="258" ry="228"/>
    </g>
    <g transform="translate(400 0)">
      <ellipse rx="26" ry="22"/><ellipse rx="48" ry="42"/><ellipse rx="72" ry="63"/>
      <ellipse rx="98" ry="86"/><ellipse rx="126" ry="111"/><ellipse rx="156" ry="138"/>
      <ellipse rx="188" ry="166"/><ellipse rx="222" ry="196"/><ellipse rx="258" ry="228"/>
    </g>
    <g transform="translate(0 400)">
      <ellipse rx="26" ry="22"/><ellipse rx="48" ry="42"/><ellipse rx="72" ry="63"/>
      <ellipse rx="98" ry="86"/><ellipse rx="126" ry="111"/><ellipse rx="156" ry="138"/>
      <ellipse rx="188" ry="166"/><ellipse rx="222" ry="196"/><ellipse rx="258" ry="228"/>
    </g>
    <g transform="translate(400 400)">
      <ellipse rx="26" ry="22"/><ellipse rx="48" ry="42"/><ellipse rx="72" ry="63"/>
      <ellipse rx="98" ry="86"/><ellipse rx="126" ry="111"/><ellipse rx="156" ry="138"/>
      <ellipse rx="188" ry="166"/><ellipse rx="222" ry="196"/><ellipse rx="258" ry="228"/>
    </g>

    <!-- centre slice -->
    <g transform="translate(200 200)" stroke="#A98B57" opacity="0.85">
      <ellipse rx="16" ry="13"/>
      <ellipse rx="30" ry="26"/>
      <ellipse rx="45" ry="39"/>
      <ellipse rx="61" ry="53"/>
      <ellipse rx="78" ry="68"/>
      <ellipse rx="96" ry="84"/>
    </g>
  </g>

  <!-- radial shakes, the fine cracks running out from the heart -->
  <g stroke="#9A7E52" stroke-width="1.1" opacity="0.34" stroke-linecap="round">
    <path d="M200 200 L 262 148"/>
    <path d="M200 200 L 152 262"/>
    <path d="M200 200 L 268 236"/>
    <path d="M0 0 L 74 58"/>
    <path d="M400 0 L 330 66"/>
    <path d="M0 400 L 68 332"/>
    <path d="M400 400 L 336 330"/>
  </g>

  <!-- heartwood -->
  <g fill="#B99A6E" opacity="0.4">
    <ellipse cx="200" cy="200" rx="7" ry="6"/>
    <ellipse cx="0" cy="0" rx="9" ry="7"/>
    <ellipse cx="400" cy="0" rx="9" ry="7"/>
    <ellipse cx="0" cy="400" rx="9" ry="7"/>
    <ellipse cx="400" cy="400" rx="9" ry="7"/>
  </g>
</svg>
