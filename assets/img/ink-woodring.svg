<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Wood cross section">
  <defs>
    <filter id="ringWarp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="heart" cx="44%" cy="40%" r="66%">
      <stop offset="0%" stop-color="#8A5F2E"/>
      <stop offset="58%" stop-color="#6B4823"/>
      <stop offset="100%" stop-color="#4E3319"/>
    </radialGradient>
    <radialGradient id="bark" cx="50%" cy="50%" r="50%">
      <stop offset="86%" stop-color="#3A2513"/>
      <stop offset="100%" stop-color="#1C1208"/>
    </radialGradient>
  </defs>

  <!-- bark rim -->
  <circle cx="210" cy="210" r="200" fill="url(#bark)"/>
  <circle cx="210" cy="210" r="186" fill="#E3D2B2"/>

  <!-- growth rings, warped so they read as real timber -->
  <g filter="url(#ringWarp)" fill="none" stroke="#A98B57" stroke-width="2" opacity="0.72">
    <ellipse cx="206" cy="206" rx="24" ry="21"/>
    <ellipse cx="208" cy="204" rx="42" ry="37"/>
    <ellipse cx="212" cy="208" rx="60" ry="54"/>
    <ellipse cx="206" cy="212" rx="79" ry="70"/>
    <ellipse cx="212" cy="204" rx="98" ry="88"/>
    <ellipse cx="204" cy="210" rx="118" ry="106"/>
    <ellipse cx="212" cy="206" rx="138" ry="124"/>
    <ellipse cx="206" cy="212" rx="158" ry="143"/>
    <ellipse cx="210" cy="206" rx="176" ry="160"/>
  </g>

  <!-- latewood bands, darker and tighter -->
  <g filter="url(#ringWarp)" fill="none" stroke="#7A5730" stroke-width="1" opacity="0.45">
    <ellipse cx="210" cy="207" rx="33" ry="29"/>
    <ellipse cx="209" cy="211" rx="70" ry="62"/>
    <ellipse cx="211" cy="205" rx="108" ry="97"/>
    <ellipse cx="208" cy="211" rx="148" ry="133"/>
  </g>

  <!-- heartwood -->
  <ellipse cx="208" cy="207" rx="13" ry="11" fill="url(#heart)" opacity="0.85"/>

  <!-- radial shakes -->
  <g stroke="#8A6B41" stroke-width="1.6" fill="none" opacity="0.5" stroke-linecap="round" filter="url(#ringWarp)">
    <path d="M210 210 C 246 186, 282 168, 320 158"/>
    <path d="M210 210 C 186 244, 168 280, 160 318"/>
    <path d="M210 210 C 240 244, 264 274, 274 306"/>
    <path d="M210 210 C 174 188, 142 176, 108 172"/>
  </g>

  <!-- a soft sheen across the face -->
  <ellipse cx="150" cy="140" rx="86" ry="52" fill="#FFF6E4" opacity="0.16" transform="rotate(-32 150 140)"/>
</svg>
