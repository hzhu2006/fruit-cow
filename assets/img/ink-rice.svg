<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 250" role="img" aria-label="Rice panicle, ink wash">
  <defs>
    <filter id="riceWash" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="grainG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9D6A8"/>
      <stop offset="100%" stop-color="#C99A4E"/>
    </linearGradient>
  </defs>

  <ellipse cx="86" cy="140" rx="56" ry="86" fill="#3A2A1A" opacity="0.08" filter="url(#riceWash)"/>

  <!-- stem, bowing under the weight -->
  <path d="M36 246 C 40 200, 46 158, 62 118 C 76 84, 100 56, 132 38"
        fill="none" stroke="#2A2119" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>

  <!-- two leaves, tapered brush blades -->
  <path d="M52 196 C 26 186, 6 166, -2 142 C 24 150, 46 170, 56 190 Z" fill="#2A2119" opacity="0.72"/>
  <path d="M66 148 C 92 132, 122 128, 148 136 C 120 150, 90 156, 68 154 Z" fill="#2A2119" opacity="0.6"/>

  <!-- grains hanging off the droop -->
  <g fill="url(#grainG)" stroke="#8A6420" stroke-width="0.9">
    <ellipse cx="128" cy="46" rx="6" ry="9" transform="rotate(28 128 46)"/>
    <ellipse cx="118" cy="60" rx="6" ry="9" transform="rotate(22 118 60)"/>
    <ellipse cx="134" cy="62" rx="5.6" ry="8.6" transform="rotate(40 134 62)"/>
    <ellipse cx="106" cy="74" rx="6" ry="9" transform="rotate(16 106 74)"/>
    <ellipse cx="122" cy="80" rx="5.6" ry="8.6" transform="rotate(34 122 80)"/>
    <ellipse cx="94" cy="90" rx="6" ry="9" transform="rotate(10 94 90)"/>
    <ellipse cx="110" cy="98" rx="5.6" ry="8.6" transform="rotate(28 110 98)"/>
    <ellipse cx="82" cy="108" rx="6" ry="9" transform="rotate(4 82 108)"/>
    <ellipse cx="98" cy="116" rx="5.4" ry="8.4" transform="rotate(22 98 116)"/>
    <ellipse cx="72" cy="128" rx="5.6" ry="8.6" transform="rotate(-2 72 128)"/>
    <ellipse cx="86" cy="136" rx="5.2" ry="8.2" transform="rotate(16 86 136)"/>
  </g>

  <!-- awns, the hair-fine tips -->
  <g stroke="#8A6420" stroke-width="1" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M132 38 C 142 30, 150 26, 158 26"/>
    <path d="M122 52 C 134 44, 144 42, 152 44"/>
    <path d="M108 66 C 120 60, 132 58, 140 60"/>
    <path d="M94 82 C 106 76, 118 74, 126 76"/>
    <path d="M80 100 C 92 94, 104 92, 112 94"/>
  </g>
</svg>
