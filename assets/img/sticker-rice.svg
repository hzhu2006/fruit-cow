<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Rice sticker">
  <defs>
    <linearGradient id="rsGrain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFD9A6"/>
      <stop offset="100%" stop-color="#C99A4E"/>
    </linearGradient>
    <filter id="rsEdge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- sticker body: paper disc with a torn edge -->
  <g filter="url(#rsEdge)">
    <circle cx="60" cy="60" r="54" fill="#FCF6E8"/>
    <circle cx="60" cy="60" r="54" fill="none" stroke="#D9CBAE" stroke-width="2"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="#D97B29" stroke-width="1.4" opacity="0.6"
            stroke-dasharray="5 6"/>
  </g>

  <!-- rice panicle inside -->
  <path d="M38 92 C 44 74, 54 58, 72 46" fill="none" stroke="#2A2119" stroke-width="2.2"
        stroke-linecap="round" opacity="0.85"/>
  <path d="M46 78 C 34 72, 26 62, 24 52 C 36 56, 46 66, 50 74 Z" fill="#2A2119" opacity="0.6"/>

  <g fill="url(#rsGrain)" stroke="#8A6420" stroke-width="0.8">
    <ellipse cx="70" cy="48" rx="4.4" ry="6.6" transform="rotate(30 70 48)"/>
    <ellipse cx="62" cy="58" rx="4.4" ry="6.6" transform="rotate(24 62 58)"/>
    <ellipse cx="76" cy="60" rx="4" ry="6.2" transform="rotate(42 76 60)"/>
    <ellipse cx="54" cy="70" rx="4.4" ry="6.6" transform="rotate(18 54 70)"/>
    <ellipse cx="68" cy="72" rx="4" ry="6.2" transform="rotate(36 68 72)"/>
    <ellipse cx="84" cy="50" rx="4" ry="6.2" transform="rotate(48 84 50)"/>
  </g>
</svg>
