<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Fruit Cow seal">
  <defs>
    <filter id="sealRough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#sealRough)">
    <!-- cinnabar paste block, hand-carved corners -->
    <path d="M8 10 C 30 7, 70 7, 92 10 C 94 32, 94 68, 92 90
             C 70 93, 30 93, 8 90 C 6 68, 6 32, 8 10 Z" fill="#A8382C"/>

    <!-- carved-out strokes in seal-script spirit -->
    <g stroke="#F7F0E6" stroke-width="5.5" fill="none" stroke-linecap="square">
      <!-- left character: a fruit on a stem -->
      <path d="M24 26 L 24 46"/>
      <path d="M16 34 C 20 26, 28 26, 32 34"/>
      <path d="M18 56 L 30 56 L 30 76 L 18 76 Z"/>
      <!-- right character: a horned head -->
      <path d="M50 30 L 50 74"/>
      <path d="M68 26 C 64 34, 64 44, 68 52"/>
      <path d="M50 44 L 74 44"/>
      <path d="M56 62 L 80 62"/>
      <path d="M74 30 L 74 52"/>
    </g>

    <!-- uneven ink at the border, like real paste -->
    <path d="M8 10 C 30 7, 70 7, 92 10" stroke="#8E2F26" stroke-width="3" fill="none" opacity="0.55"/>
  </g>
</svg>
