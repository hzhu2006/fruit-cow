<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none" role="img" aria-label="Curve">
  <!-- A long double curve, used to transition between sections. -->
  <defs>
    <linearGradient id="waveFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97B29" stop-opacity="0"/>
      <stop offset="20%" stop-color="#D97B29" stop-opacity="0.6"/>
      <stop offset="44%" stop-color="#E8B23C" stop-opacity="0.55"/>
      <stop offset="68%" stop-color="#2F8F94" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2C5282" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="M0 84
           C 160 84, 240 26, 400 26
           C 560 26, 640 94, 800 94
           C 940 94, 1030 44, 1200 40"
        fill="none" stroke="url(#waveFade)" stroke-width="2.4" stroke-linecap="round"/>

  <path d="M0 96
           C 170 96, 250 40, 410 40
           C 570 40, 650 106, 810 106
           C 946 106, 1036 58, 1200 54"
        fill="none" stroke="url(#waveFade)" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
</svg>
