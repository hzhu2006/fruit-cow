<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Tileable light-oak grain. Used as a card backdrop at low strength. -->
  <defs>
    <filter id="oakGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.34" numOctaves="5" seed="9" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g">
        <feFuncA type="table" tableValues="0 0.30"/>
      </feComponentTransfer>
    </filter>
    <filter id="oakSoft" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.002 0.05" numOctaves="3" seed="21" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g">
        <feFuncA type="table" tableValues="0 0.22"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="420" height="420" fill="#EADCC2"/>

  <!-- broad tonal sweep -->
  <rect width="420" height="420" filter="url(#oakSoft)" style="mix-blend-mode:multiply"/>

  <!-- cathedral grain lines -->
  <g fill="none" stroke="#B79C77" stroke-width="1.1" opacity="0.34">
    <path d="M-10 40 C 120 24, 300 56, 430 34"/>
    <path d="M-10 96 C 140 80, 280 112, 430 88"/>
    <path d="M-10 158 C 110 140, 320 176, 430 148"/>
    <path d="M-10 224 C 150 208, 290 240, 430 214"/>
    <path d="M-10 292 C 120 274, 310 306, 430 282"/>
    <path d="M-10 356 C 140 340, 280 372, 430 348"/>
  </g>

  <!-- knot -->
  <g opacity="0.26" fill="none" stroke="#9A7E58" stroke-width="1.2">
    <ellipse cx="318" cy="238" rx="22" ry="9"/>
    <ellipse cx="318" cy="238" rx="13" ry="5"/>
  </g>

  <!-- fine grain -->
  <rect width="420" height="420" filter="url(#oakGrain)" style="mix-blend-mode:multiply"/>
</svg>
