<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="Bamboo, ink wash">
  <defs>
    <linearGradient id="stalk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E2B26" stop-opacity="0.92"/>
      <stop offset="46%" stop-color="#4A463E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#241F1A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="bleed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="wash" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- ink wash bloom behind -->
  <ellipse cx="118" cy="196" rx="72" ry="104" fill="#3A362F" opacity="0.09" filter="url(#wash)"/>

  <!-- back stalk, lighter -->
  <g opacity="0.42">
    <path d="M158 306 C 152 244, 156 176, 150 118 L 168 116 C 174 176, 170 244, 176 306 Z" fill="#4A463E"/>
    <path d="M150 214 C 158 210, 168 210, 174 213" stroke="#241F1A" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- main stalk -->
  <path d="M74 312 C 66 240, 74 158, 68 74 L 96 70 C 104 158, 96 240, 104 312 Z" fill="url(#stalk)"/>
  <!-- nodes -->
  <g stroke="#191612" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M70 246 C 80 240, 92 240, 100 244"/>
    <path d="M69 176 C 79 170, 93 170, 101 174"/>
    <path d="M68 108 C 78 102, 92 102, 100 106"/>
  </g>

  <!-- second stalk -->
  <path d="M116 314 C 110 250, 118 186, 112 120 L 132 118 C 138 186, 130 250, 136 314 Z" fill="#3B372F" opacity="0.78"/>
  <path d="M113 232 C 121 227, 130 227, 136 231" stroke="#191612" stroke-width="3.6" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- leaves: tapered brush blades -->
  <g fill="#241F1A">
    <path d="M96 96 C 126 74, 168 62, 208 66 C 170 88, 130 100, 96 96 Z" opacity="0.9"/>
    <path d="M92 118 C 60 100, 26 92, -6 96 C 26 116, 60 126, 92 118 Z" opacity="0.72"/>
    <path d="M100 142 C 132 132, 170 134, 198 148 C 162 158, 126 156, 100 142 Z" opacity="0.8"/>
    <path d="M74 168 C 46 158, 14 160, -10 172 C 18 182, 50 180, 74 168 Z" opacity="0.6"/>
    <path d="M136 128 C 164 110, 200 100, 232 104 C 200 124, 166 134, 136 128 Z" opacity="0.5"/>
    <path d="M112 200 C 142 190, 178 194, 204 208 C 170 218, 138 214, 112 200 Z" opacity="0.66"/>
  </g>

  <!-- a few dry-brush flecks -->
  <g fill="#241F1A" opacity="0.3" filter="url(#bleed)">
    <ellipse cx="196" cy="176" rx="9" ry="2.4" transform="rotate(-14 196 176)"/>
    <ellipse cx="34" cy="214" rx="7" ry="2" transform="rotate(9 34 214)"/>
  </g>
</svg>
